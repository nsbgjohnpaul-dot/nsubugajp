<!doctype html><html><head><style>body{margin:0}iframe{border:0;display:block}</style></head><body><script>
const params = new URLSearchParams(location.search);
const names = params.has('preview') ? [params.get('preview')] : ['index','work','about','idea-box','contact','body-and-soil'];
const sizes = params.has('preview') ? [[390,844]] : [[1366,768],[390,844],[800,600]];
const results=[];
async function run(){for(const [width,height] of sizes){for(const name of names){const frame=document.createElement('iframe');frame.width=width;frame.height=height;frame.src='../'+name+'.html';document.body.append(frame);await new Promise(resolve=>frame.onload=resolve);await new Promise(resolve=>setTimeout(resolve,100));const doc=frame.contentDocument;const root=doc.scrollingElement;const outside=[...doc.querySelectorAll('main h1, main h2, main p, main li, main a, header, footer')].filter(el=>el.getClientRects().length).filter(el=>{const r=el.getBoundingClientRect();return r.left < -1 || r.right > width+1 || r.top < -1 || r.bottom > height+1;}).map(el=>el.className||el.tagName);results.push({name,width,height,scrollWidth:root.scrollWidth,scrollHeight:root.scrollHeight,outside});if(!params.has('preview'))frame.remove();}}const pre=document.createElement('pre');pre.textContent=JSON.stringify(results);pre.id='results';document.body.append(pre);}run();
</script></body></html>
