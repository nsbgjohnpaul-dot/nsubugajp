<!doctype html><html><body style="margin:0"><script>
(async()=>{const results=[];for(const [width,height] of [[1366,768],[390,844],[800,600]]){const frame=document.createElement('iframe');frame.style.border='0';frame.width=width;frame.height=height;frame.src='../idea-box.html';document.body.append(frame);await new Promise(resolve=>frame.onload=resolve);const w=frame.contentWindow,d=frame.contentDocument,tiles=[...d.querySelectorAll('.idea-tile')],viewer=d.querySelector('[data-artwork-viewer]'),preview=d.querySelector('.idea-preview');const vr=viewer.getBoundingClientRect();const overlap=tiles.filter(tile=>{const r=tile.getBoundingClientRect();return r.left<vr.right&&r.right>vr.left&&r.top<vr.bottom&&r.bottom>vr.top;}).length;const transfer=new w.DataTransfer();tiles[0].querySelector('img').dispatchEvent(new w.DragEvent('dragstart',{bubbles:true,dataTransfer:transfer}));viewer.dispatchEvent(new w.DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:transfer}));const dragPass=!preview.hidden&&preview.src===tiles[0].querySelector('img').src;d.querySelector('.idea-preview-close').click();const closePass=preview.hidden;tiles[1].click();const tapPass=!preview.hidden&&preview.src===tiles[1].querySelector('img').src;const fileTransfer=new w.DataTransfer();fileTransfer.items.add(new w.File(['<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><rect width="50" height="50" fill="red"/></svg>'],'sample.svg',{type:'image/svg+xml'}));tiles[8].dispatchEvent(new w.DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:fileTransfer}));const filePass=!!tiles[8].querySelector('img')&&!preview.hidden;results.push({width,height,count:tiles.length,overlap,dragPass,closePass,tapPass,filePass,scrollWidth:d.scrollingElement.scrollWidth,scrollHeight:d.scrollingElement.scrollHeight});if(width!==390)frame.remove();}const pre=document.createElement('pre');pre.id='results';pre.textContent=JSON.stringify(results);document.body.append(pre);})();
</script></body></html>
